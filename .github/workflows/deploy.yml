name: PHP CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          echo "Checking PHP syntax..."
          find . -type f -name "*.php" -exec php -l {} \;

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/dockeronsed:latest .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/dockeronsed:latest

  deploy:
    name: Deploy to GoDaddy VPS
    runs-on: ubuntu-latest
    needs: build-and-push          # Wait for build to finish first

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull the latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/dockeronsed:83e699b274d0

            # Stop and remove old container
            docker stop dockeronsed || true
            docker rm dockeronsed || true

            # Run the new container
            # ⚠️ Change the port if needed (example: -p 80:80 or -p 8080:80)
            docker run -d \
              --name dockeronsed \
              --restart unless-stopped \
              -p 5050:80 \
              ${{ secrets.DOCKER_USERNAME }}/dockeronsed:83e699b274d0

            # Clean up old images
            docker image prune -f