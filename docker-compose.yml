services:
  web:
    image: tech2mango/dockeronsed:latest
    container_name: dockeronsed
    ports:
      - "5055:80"
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: test
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword